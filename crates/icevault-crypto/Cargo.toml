[package]
name = "icevault-crypto"
description = "Cryptographic core of the icevault password manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
rand = "0.10.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12.0"
